services:

  traefik:
    image: traefik:3.1
    container_name: traefik
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    restart: unless-stopped
    environment:
      - ROOT_DOMAIN
      - PUBLIC
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./config/traefik:/etc/traefik"
      - "./data/traefik:/data/"
    networks:
      - personal-site-ingress
      - connect4-ingress
    profiles:
      - infra

  personal-site:
    image: automationmusician/personal-site:latest
    build: ../personal-site/
    container_name: personal-site
    restart: unless-stopped
    networks:
      - personal-site-ingress
    profiles:
      - app

  connect4:
    image: automationmusician/connect4:latest
    build: ../connect-4-ai-801/
    container_name: connect4
    environment:
      BASE_PATH: "/connect4"
      MAX_DEPTH: 6
    restart: unless-stopped
    networks:
      - connect4-ingress
    profiles:
      - app

networks:
  personal-site-ingress: {}
  connect4-ingress: {}